  cx.save();cx.translate(f.x,f.y+34);cx.scale(1,.55);cx.globalCompositeOperation='lighter';
  for(let i=9;i>=0;i--){
    const of=(i-4.5)*3.7,fall=Math.exp(-Math.pow(of/13,2));
    cx.strokeStyle='rgba('+col+','+(fall*.08*(1-u))+')';cx.lineWidth=3.5;
    cx.beginPath();cx.arc(0,0,Math.max(0,r+of),0,Math.PI*2);cx.stroke();
  }cx.restore();
}

const easeOut=u=>1-Math.pow(1-u,3);

function render(){

  if(M.musou){if(M.exit)draws.push({y:(M.exit.y+1)*TS-30,f:()=>drawExit(M.exit)});drawPickups();for(const gt of M.gates)draws.push({y:(gt.y1+1)*TS,f:()=>drawGate(gt)});for(const a of allies)draws.push({y:a.y,f:()=>drawMob(a)});}
  for(const m of mobs){if(m.x<x0-120||m.x>x0+vw+120||m.y<y0-60||m.y>y0+vh+200)continue;draws.push({y:m.y,f:()=>drawMob(m)});}

  draws.sort((a,b)=>a.y-b.y);

  cx.globalAlpha=1;

    cx.beginPath();cx.arc(joy.ox,joy.oy,58,0,7);cx.fill();cx.stroke();

  if(M.type!=='field'||(M.sty&&M.sty!=='out')){const g=cx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.4,VW/2,VH/2,Math.max(VW,VH)*.8);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');cx.fillStyle=g;cx.fillRect(0,0,VW,VH);}

/* 수동 벨트액션 조합기. 실제 누름 한 번에 입력 하나, 대기 슬롯 하나만 허용. */
const COMBO_TIMING={light:.54,heavy:.75,linkAt:.82,chainGap:1850,bufferMs:1250};
const CB={pending:null,seq:'',last:0,weapon:null,dashUntil:0,dash:null,accepted:0,lastMove:null,activated:0};
const COMBO_MOVES={LLH:'arc',LLLH:'pierce',LLLLH:'spin',HHL:'slam',HHHL:'rocks'};
const comboNow=()=>performance.now();
function comboReset(){CB.pending=null;CB.seq='';CB.last=0;CB.dashUntil=0;CB.dash=null;if(P){P.cbMove=null;P.cbAction=null;P.cbRushHit=null;}}
function comboPress(kind){
  if(!P||UI.mode!=='battle'||UI.paused||P.mode!=='manual'||P.hp<=0||P.sk||P.skHit)return false;
  if(ULT.active||CB.pending)return false;                       // 대기 슬롯을 덮어쓰거나 누적하지 않는다
  const now=comboNow(),key=dirKey(P.face)[0],anim=P.atk&&A.man[P.atk]&&A.man[P.atk][key];
  const remaining=anim&&P.cbAction?Math.max(0,1-P.atkT/anim.frames)*comboAttackDuration()/(P.slowT>0?.65:1)*1000:0;
  CB.pending={kind,at:now,until:now+Math.max(COMBO_TIMING.bufferMs,remaining+250)};CB.accepted++;
  return true;
}
function comboDirection(inp){
  if(inp&&(inp.x||inp.y)){const l=Math.hypot(inp.x,inp.y)||1;return {x:inp.x/l,y:inp.y/l};}
  const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.face]||[0,1];
  return {x:d[0],y:d[1]};
}
/* 타격 판정 이후 동작의 끝 18%는 다음 입력으로 연결한다.
   공격속도 장비가 추가되어도 애니메이션 진행률을 기준으로 판정한다. */
function comboCancelReady(){
  if(!P.atk||!P.cbAction||P.cbMove||P.sk||P.skHit||!P.hitDone)return false;
  const key=dirKey(P.face)[0],e=A.man[P.atk]&&A.man[P.atk][key];
  return !!e&&P.atkT/e.frames>=COMBO_TIMING.linkAt;
}
function comboReleaseAttack(){

}
function comboBegin(entry,n,inp){

    const d=comboDirection(inp);CB.seq='';CB.last=0;CB.dash={...d,t:0};CB.dashUntil=now+420;
    P.face=faceTo(d.x,d.y);P.state='move';

  }
  const w=combatWeapon(),letter=kind==='light'?'L':'H';

  else{
    if(w!==CB.weapon||now-CB.last>COMBO_TIMING.chainGap)CB.seq='';
    CB.seq+=letter;
    move=COMBO_MOVES[CB.seq]||null;
    if(move)CB.seq='';
    else if(!['L','LL','LLL','LLLL','H','HH','HHH'].includes(CB.seq))CB.seq=letter;

function comboTick(dt,n,inp){

function comboAttackDuration(){
  const base=P.cbMove==='spin'?2.24:P.cbMove==='pierce'?1.00:P.cbMove==='dashLight'?.90:P.cbMove==='rocks'?1.12:P.cbAction==='light'?COMBO_TIMING.light:COMBO_TIMING.heavy;
  /* 장비 공속 배율은 나중에 추가해도 콤보 입력 판정과 독립적이다. */
  const rate=Math.max(.5,Math.min(2.5,Number(ST.attackSpeed)||1));
  return base/rate;
}
function comboFps(e){
  if(!P.cbAction)return e.fps*SPD[P.atk]*(P.slowT>0?.6:1);
  return e.frames/comboAttackDuration()*(P.slowT>0?.65:1);
}
function comboDamage(m,power,kb,ang,stun){
  const w=P.cbWeapon||combatWeapon();
  hitMob(m,stat.atk()*power*(w==='fan'?.78:w==='whip'?.85:1),w,kb,ang);
  if(!m.dead&&!m.boss&&stun&&!enemyArmored(m))m.stun=Math.max(m.stun,stun);
}
/* 채찍은 원거리 전격을 발사하지 않는다. 기존 기술명·타격 범위는 유지. */
function comboStrike(move,part){
  const w=P.cbWeapon||combatWeapon(),a=P.cbAngle||0,px=P.x,py=P.y,ct=Math.cos(a),st=Math.sin(a),list=liveMobs();
  const radial=move==='spin'||move==='slam'||move==='rocks'||move==='dashHeavy';
  const radius=w==='whip'?REACH.whip:move==='spin'?285:move==='rocks'?340:move==='slam'?218:move==='dashHeavy'?160:move==='dashLight'?165:w==='fan'?440:240;
  const power=move==='spin'?.67:move==='rocks'?2.3:move==='slam'?1.7:move==='dashHeavy'?1.05:move==='dashLight'?.65:move==='arc'?1.7:1.8;
  const kb=move==='dashHeavy'?470:move==='slam'||move==='rocks'?390:move==='spin'?240:move==='dashLight'?135:225;
  if(w==='whip')fx.push({k:'whipSweep',x:px,y:py,t:0,life:.30,R:radius,a,radial,ha:move==='arc'?1.18:.78});
  else fx.push({k:radial?'shock':'sweep',x:px,y:radial?py:py-CH*.3,t:0,life:.32,R:radius,a,ha:move==='arc'?1.18:.54,col:w==='fan'?'170,105,255':'255,205,110',col2:'255,255,255',small:move==='dashHeavy'});
  if(w==='fan'&&(move==='arc'||move==='dashLight')){
    const count=move==='arc'?5:3;
    for(let i=0;i<count;i++){
      const aa=a+(i-(count-1)/2)*.2;
      orbs.push({x:px+Math.cos(aa)*35,y:py-CH+Math.sin(aa)*35,vx:Math.cos(aa)*580,vy:Math.sin(aa)*580,t:0,hit:new Set(),left:2+ST.prc,m:.55});
    }
  }
  for(const m of list){
    const dx=m.x-px,dy=m.y-py,d=Math.hypot(dx,dy),da=Math.atan2(dy,dx),dot=dx*ct+dy*st;
    let delta=Math.abs(da-a);if(delta>Math.PI)delta=2*Math.PI-delta;
    const within=d<=(w==='whip'?radius:radius+m.scale*12);
    const fits=radial?within:move==='arc'?within&&delta<1.20:move==='dashLight'?within&&delta<.95:dot>0&&within&&delta<.58;
    if(!fits)continue;
    comboDamage(m,power,kb,da,move==='slam'?.9:move==='rocks'?1.2:move==='dashHeavy'?.4:w==='whip'?.45:0);
    /* 채찍은 근접 타격 궤적만 표시한다. */
  }
  if(move==='rocks')for(let i=0;i<19;i++){
    const q=i*Math.PI*2/19;
    fx.push({k:'deb',x:px+Math.cos(q)*rnd(10,60),y:py-18,vx:Math.cos(q)*rnd(90,330),vy:-rnd(120,380),t:0,life:rnd(.38,.7)});
    /* 채찍은 근접 타격 궤적만 표시한다. */
  }
  /* 채찍은 근접 타격 궤적만 표시한다. */
  if(w==='fan')fx.push({k:'ring',x:px,y:py-25,t:0,life:.3,R:radius*.6});
  shake=Math.max(shake,move==='rocks'?10:move==='slam'?7:move==='dashHeavy'?5:3);
}
function comboMoveTick(dt,prev,frame,total){
  const move=P.cbMove;
  if(move==='pierce'){
    const d=P.cbDir,u=frame/total;
    if(u<.88){moveEnt(P,d.x*650*dt,d.y*650*dt,18);fx.push({k:'sp2',x:P.x,y:P.y-CH,vx:-d.x*60,vy:-90,t:0,life:.23});}
    for(const m of liveMobs()){
      if(P.cbRushHit.has(m)||Math.hypot(m.x-P.x,m.y-P.y)>(P.cbWeapon==='whip'?Math.min(REACH.whip,100+m.scale*15):100+m.scale*15))continue;
      P.cbRushHit.add(m);comboDamage(m,2.1,320,Math.atan2(m.y-P.y,m.x-P.x),P.cbWeapon==='whip'?.6:0);
      /* 채찍은 근접 타격 궤적만 표시한다. */
    }
  }else if(move==='dashLight'){
    const thresholds=[.23,.47,.71];
    while(P.cbTriple<3&&frame/total>=thresholds[P.cbTriple]){
      comboStrike('dashLight',P.cbTriple);P.cbTriple++;
    }
  }
}

function musouBoom(m){
  m.done=true;
  const radius=m.last?270:145,power=stat.atk()*(m.last?4.7:2.05);
  ULT.blasts.push({x:m.x,y:m.y,r:radius,at:ULT.t,last:m.last});
  for(const enemy of liveMobs()){
    const dist=Math.hypot(enemy.x-m.x,enemy.y-m.y),reach=radius+enemy.scale*15;
    if(dist>reach)continue;
    const angle=Math.atan2(enemy.y-m.y,enemy.x-m.x);
    hitMob(enemy,power*(1-dist/reach*.22),'fan',m.last?640:360,angle);
    if(!enemy.dead&&!enemy.boss)enemy.stun=Math.max(enemy.stun,m.last?.85:.38);
  }
  pops.push({x:m.x,y:m.y-70,t:0,txt:m.last?'콰아앙!!':'펑!',col:m.last?'#ffe9ac':'#ffe1fc',size:m.last?32:21,vy:-22,life:.75});
  CM_AUDIO.play('explosion');shake=Math.max(shake,m.last?19:9);
}

function musouTick(dt){
  if(!ULT.active)return;
  ULT.t+=dt;
  if(ULT.phase==='portrait'){
    if(ULT.t>=.72){ULT.phase='rain';ULT.t=0;ULT.next=0;}
    return;
  }
  while(ULT.next<ULT.meteors.length){
    const m=ULT.meteors[ULT.next];
    if(ULT.t<m.at+m.fall)break;
    musouBoom(m);ULT.next++;
  }
  ULT.blasts=ULT.blasts.filter(b=>ULT.t-b.at<.55);
  shake=Math.max(0,shake-dt*14);
  if(ULT.next===ULT.meteors.length&&ULT.blasts.length===0){
    ULT.active=false;ULT.phase='';ULT.meteors.length=0;shake=0;save();
  }
}

/* 아래 두 그리기는 기존 월드 좌표 변환/화면 좌표 변환 안에서 각각 호출한다. */
function musouDrawWorld(){
  if(!ULT.active||ULT.phase!=='rain')return;
  for(const m of ULT.meteors){
    if(m.done||ULT.t<m.at)continue;
    const u=Math.min(1,(ULT.t-m.at)/m.fall),yy=m.y-340*(1-u)*(1-u),im=ULT.images[m.sprite];
    cx.save();cx.globalCompositeOperation='lighter';
    const trail=cx.createLinearGradient(m.x,yy-115,m.x,yy+15);
    trail.addColorStop(0,'rgba(255,120,235,0)');trail.addColorStop(.55,'rgba(255,140,235,.13)');trail.addColorStop(1,'rgba(255,245,220,.5)');
    cx.fillStyle=trail;cx.beginPath();cx.ellipse(m.x,yy-35,m.size*.24,105,-.17,0,Math.PI*2);cx.fill();cx.restore();
    if(im&&im.complete&&im.naturalWidth){
      cx.save();cx.translate(m.x,yy);cx.rotate(m.rot+u*.85);cx.shadowBlur=19;cx.shadowColor='rgba(255,137,233,.75)';
      cx.drawImage(im,-m.size*.5,-m.size*.7,m.size,m.size);cx.restore();
    }
  }
  for(const b of ULT.blasts){
    const u=(ULT.t-b.at)/.55,r=b.r*(.12+.88*(1-Math.pow(1-u,3)));cx.save();cx.globalCompositeOperation='lighter';
    cx.translate(b.x,b.y);cx.scale(1,YR);
    const g=cx.createRadialGradient(0,0,r*.13,0,0,r);
    g.addColorStop(0,'rgba(255,255,244,'+(.60*(1-u))+')');

    g.addColorStop(.73,'rgba(234,103,255,'+(.16*(1-u))+')');g.addColorStop(1,'rgba(224,90,255,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,r,0,Math.PI*2);cx.fill();cx.restore();
  }
}

    const lv=document.createElement('div');lv.className='lv';lv.textContent=(sl==='weapon'&&it?WN[it.w]:'');c.appendChild(lv);

  $('bstat').innerHTML=[['레벨',S.lv+(S.lv>=LVCAP?' (최대)':'')],['공격력',fmt1(ST.atk)],['체력',fmt(ST.maxHp)],['방어력',fmt1(ST.def)],['치명타',Math.round(ST.crit)+'% · 피해 '+Math.round(ST.critd)+'%'],['스킬 재사용 단축',Math.round(ST.cdr)+'%']].map(r=>'<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
  document.querySelectorAll('#sellset input[data-t]').forEach(i=>{i.checked=!!S.sell.t[+i.dataset.t];});
  $('swk').checked=!!S.sell.weak;
  $('sellnow').disabled=!S.inv.some(sellable);
  const tabs=$('btabs');tabs.innerHTML='';
  for(const [k,n] of [['all','전체'],['weapon','무기'],['ring','반지'],['necklace','목걸이'],['armor','갑옷']]){
    const b=document.createElement('button');b.textContent=n;if(bagF===k)b.className='on';b.onclick=()=>{bagF=k;renderBag();};tabs.appendChild(b);

  const list=S.inv.filter(it=>bagF==='all'||it.s===bagF).sort((a,b)=>b.t-a.t||(UPV[b.id]||0)-(UPV[a.id]||0)||b.st-a.st);
  if(!list.length){const d=document.createElement('div');d.className='none';d.textContent='가방이 비어 있습니다.';g.appendChild(d);}

  }
  col.scrollTop=sc;

choseon","t":"어우, 청승맞아! 언니, 요새 클럽 트렌드는 끈적한 EDM 베이스야! 골반 튕기게 템포 좀 올려봐!"},{"w":"wenji","t":"아앗... 발차기가 제 몸에 닿을 때마다, 제 안의 끊어졌던 현이 쾌감을 노래하고 있어요... 너무... 찌릿해요...","note":"몸을 비비 꼬며"}]},{"n":7,"t":"조비 구출전","sub":"꽁꽁 언 그곳","gm":"빙판길 슬라이딩.","hero":["caopi"],"kind":"rescue","lines":[{"w":"caopi","t":"초선... 너무 춥소... 하반신의 감각이 없소... 제발 나를 그 뜨거운 품으로 품어주오..."},{"w":"choseon","t":"어머, 원래도 3분을 못 버티면서 얼어붙기까지 했어? 계속 거기서 꽁꽁 언 얼음과자나 돼라. 견희 언니는 내가 잘 쓰고 있으니까 딴생각 말고."}]},{"n":8,"t":"왕이 포획전","sub":"암살자의 위험한 취향","gm":"5인의 그림자 분신 (가슴의 흔들림으로 본체 파악).","hero":["wangyi"],"kind":"capture","lines":[{"w":"wangyi","t":"어리석은 여자... 내 날카로운 칼날이 네 얇은 옷가지를 전부 찢어발겨 주마!"},{"w":"choseon","t":"어머, 옷 찢는 취향이야? 말만 하면 내가 알아서 벗어줄 텐데. 분신술 써봤자 가짜들은 가슴이 안 흔들려서 다 티 나거든?"},{"w":"wangyi","t":"크윽... 당신의 그 풍만한 계곡과 아찔한 땀방울에 시선이 뺏기다니... 굴욕적이다."},{"w":"choseon","t":"말투는 살벌한데 몸은 정직하게 달아올랐네? 칼자루 쥐는 법이 너무 뻣뻣해. 내 방으로 와. 부드럽게 찌르는 법부터 다시 교습해 줄게."}]},{"n":9,"t":"허창 진입전","sub":"거칠게 열어젖히기","gm":"거점 15개 점령 후 스위치 리셋 기믹.","hero":[],"kind":"entry","lines":[{"w":"choseon","t":"아, 진짜! 문을 왜 이렇게 안 열어줘? 내 안으로 들어오고 싶어서 안달 난 남자들이 한 트럭인데, 튕기기는!"}]},{"n":10,"t":"조조 구출","sub":"간웅의 패도(覇道)","gm":"낙석을 튕겨내 보스 타격.","hero":["caocao"],"kind":"rescue","lines":[{"w":"caocao","t":"오오, 초선 공... 천하를 품었던 이 조맹덕, 오늘 당신의 그 터질듯한 흉부와 땀에 젖은 자태를 보니 내 빈약한 패도(覇道)가 부끄러워지오."},{"w":"choseon","t":"어휴, 늙은이가 주책은. 아저씨, 영웅 호색이라더니 밤일할 체력은 남아 있어? 옜다, 기 빨리는 딥키스 대신 손키스 한 방! (쪽)"},{"w":"caocao","t":"(코피를 뿜으며) 하으윽... 나의 엑스칼리버가 다시 솟아오르는 기분이오... (과다출혈 기절)"}]},{"n":11,"t":"황개 구출전","sub":"결박 플레이의 대가","gm":"화염방사기 트랩.","hero":["huanggai"],"kind":"rescue","lines":[{"w":"huanggai","t":"오오! 초선 공! 적들의 이 거칠고 뻣뻣한 밧줄이... 내 안의 깊은 무언가를 일깨우고 있소! 더 조여다오!","note":"밧줄로 칭칭 감긴 채"},{"w":"choseon","t":"어머, 할아버지 취향 엄청 매니악하시네? 싸구려 노끈으로 묶여놓고 좋대. 이따 밤에 내 가죽 채찍이랑 벨트로 진짜 결박이 뭔지 보여줄게."}]},{"n":12,"t":"태사자 구출전","sub":"맨손의 부드러움","gm":"무기 없는 적들의 인해전술.","hero":["taishici"],"kind":"rescue","lines":[{"w":"taishici","t":"내 길고 단단한 쌍철극을 뺏기고 맨손으로 버티고 있소! 무기만 있었어도 밤새 뚫어버리는 건데!"},{"w":"choseon","t":"오빠, 남자는 무기가 커야 제맛이긴 하지만 손가락 테크닉도 무시 못 한다고. 내 매끄러운 다리나 마사지하면서 연습 좀 해."}]},{"n":13,"t":"소교 포획전","sub":"파티걸의 호기심","gm":"거대한 부채질 바람.","hero":["xiaoqiao"],"kind":"capture","lines":[{"w":"xiaoqiao","t":"초선 언니! 주유 님이 왜 매일 밤 언니 치맛자락만 쳐다보는지 억울해서 못 살겠어! 내 춤이 어디가 어때서!"},{"w":"choseon","t":"어머, 아가씨. 엉덩이만 흔든다고 남자가 꼬이는 줄 알아? 골반을 튕길 땐 은근하고 끈적하게 가야지. 이리 와, 요가 매트 깔고 신음 소리 참는 법부터 밤새도록 지도해 줄게."}]},{"n":14,"t":"감녕 구출전","sub":"딸랑이는 방울 소리","gm":"타종 시 디버프.","hero":["ganning"],"kind":"rescue","lines":[{"w":"ganning","t":"크윽! 내 허리의 멋진 방울을 뺏어갔어! 그게 없으면 내 허리놀림 리듬이 안 산다고!"},{"w":"choseon","t":"어머, 방울 없다고 허리도 못 돌려? 그 빈약한 허리놀림으론 내 침대 턱걸이도 못 해. 가서 골반 스쿼트나 천 번 하고 와."}]},{"n":15,"t":"육손 구출전","sub":"타오르는 불장난","gm":"바닥 불 번짐 ➔ 스위치로 물 채우기.","hero":["luxun"],"kind":"rescue","lines":[{"w":"luxun","t":"초선 님! 하아... 너무 뜨거워서 바지를 벗어버릴 뻔했습니다!"},{"w":"choseon","t":"젊은 피가 발랑 까져가지고. 어디 벗어봐. 누나가 화끈하게 평가해 줄 테니까. 크기 안 맞으면 가차 없이 걷어차 버릴 거야."}]},{"n":16,"t":"대교 포획전","sub":"미망인의 뜨거운 밤","gm":"눈보라 이속 감소.","hero":["daqiao"],"kind":"capture","lines":[{"w":"daqiao","t":"초선 님... 제 차가운 마음에 함부로 들어오지 마세요... 남편을 잃은 제 몸은 이미 차갑게 얼어붙었답니다..."},{"w":"choseon","t":"언니, 죽은 남자 붙잡고 청승떨면서 언제까지 수절할 거야? 내 핫한 바디 라인으로 그 꽁꽁 언 몸, 확 달아오르게 녹여줄게!"},{"w":"daqiao","t":"아앗... 초선 언니의 거칠고 뜨거운 손길... 손책 님보다 더 크고... 강렬해...","note":"엎드려 헐떡임"}]},{"n":17,"t":"주유 구출전","sub":"얼굴값 하는 기생오라비","gm":"거울 방 분신 찾기.","hero":["zhouyu"],"kind":"rescue","lines":[{"w":"zhouyu","t":"이 야만인들이 내 옥 같은 뺨에 생채기를 냈소! 내 완벽한 얼굴에 흠집이 나면 당신도 슬프지 않겠소?"},{"w":"choseon","t":"웃기시네, 밤에 불 끄고 침대에 누우면 니 얼굴이 원소인지 주유인지 다 똑같아! 넌 딱 내 가죽 구두에 묻은 먼지 닦는 용도야. 엎드려서 구두나 핥아."}]},{"n":18,"t":"손상향 포획전","sub":"짐승녀 길들이기","gm":"원거리 부메랑 공격.","hero":["shangxiang"],"kind":"capture","lines":[{"w":"shangxiang","t":"내 쌍륜으로 네 얇은 허리를 반 토막 내주마! 유비 영감탱이가 네 사진만 보고 하악대는 꼴, 더는 못 봐!"},{"w":"choseon","t":"어머, 힘만 잔뜩 들어간 게 꼭 첫날밤 풋내기 같네. 남자를 다룰 땐 힘을 빼고 부드럽게 감싸야 하는 거야."},{"w":"shangxiang","t":"하아... 하아... 졌어... 언니의 그 유연한 몸놀림... 나, 힘이 하나도 안 들어가... 몸이 나른해...","note":"숨을 몰아쉬며"}]},{"n":19,"t":"건업 진입전","sub":"출렁이는 물침대","gm":"흔들리는 배 위 낙사 트랩.","hero":[],"kind":"entry","lines":[{"w":"choseon","t":"어우, 배가 너무 출렁거리잖아! 내가 침대에서 흔드는 것도 아니고, 멀미 나서 토하겠네 진짜!"}]},{"n":20,"t":"손권 구출","sub":"풋내기의 짝사랑","gm":"호랑이 유인.","hero":["sunquan"],"kind":"rescue","lines":[{"w":"sunquan","t":"초, 초선 누님... 저를 구하러 오신 그 아름다운 자태를 보니, 제 하반신... 아니, 전신에 뜨거운 피가 끓어오릅니다!"},{"w":"choseon","t":"어머, 핏덩이가 수염 좀 붙였다고 벌써 남자 행세는? 그깟 솜털로 누나를 만족시킬 수 있을 것 같아? 오늘 밤 내 방으로 와봐, 누나가 혹독하게 굴려줄 테니까."}]},{"n":21,"t":"조운 구출전","sub":"멈추지 않는 창술","gm":"아두(인형) 릴레이 추격.","hero":["zhaoyun"],"kind":"rescue","lines":[{"w":"zhaoyun","t":"초선 공... 제... 제 '창'은 언제나 당신을 향해 치솟아 있습니다! 제발 저를 짓밟아 주십시오! 헉헉!"},{"w":"choseon","t":"어머, 조 장군의 창술은 쓸데없이 빠르기만 하잖아? 난 진득하게 오래가는 남자가 좋다고. 일단 찬물 샤워나 하고 30분은 채울 체력 만들고 와."}]},{"n":22,"t":"장비 구출전","sub":"금욕의 부작용","gm":"술통 파괴 버프.","hero":["zhangfei"],"kind":"rescue","lines":[{"w":"zhangfei","t":"으아아! 술을 못 마시니까 미치겠어! 초선아, 네 쇄골에 흐르는 그 달콤한 땀방울이라도 핥게 해줘!","note":"침을 질질 흘리며"},{"w":"choseon","t":"어우, 짐승 냄새. 수염 난 아저씨는 사절이야. 내 땀방울 한 방울도 넌 감당 못 해. 저기 구석에 엎드려서 내 구두에 묻은 진흙이나 핥아."}]},{"n":23,"t":"관은병 포획전","sub":"근육녀의 굴복","gm":"지진 점프 회피.","hero":["yinping"],"kind":"capture","lines":[{"w":"yinping","t":"초선 언니! 언니의 그 얇고 요염한 허리 따위, 내 거대한 철퇴 한 방이면 으스러질 거예요!"},{"w":"choseon","t":"무식하게 힘만 잔뜩 들어간 몸매. 내가 진짜 테크닉이 뭔지 뼈저리게 느끼게 해줄게."},{"w":"yinping","t":"하으읏... 언니의 그 부드러운 몸놀림에서 어떻게 이런 짜릿한 쾌감이... 내 단단한 근육이 너무 부끄러워져요..."}]},{"n":24,"t":"황충 구출전","sub":"노장의 회춘","gm":"화살비 언덕 돌파.","hero":["huangzhong"],"kind":"rescue","lines":[{"w":"huangzhong","t":"오오, 초선 공의 그 헐벗은 자태를 보니... 죽어있던 내 '활시위'가 다시 팽팽해져 터질 것만 같소!"},{"w":"choseon","t":"할아버지, 그 나이에 팽팽하게 활시위 당기다 허리 똑 끊어져요. 주책바가지 그만 떨고 그냥 얌전히 관재나 짜세요."}]},{"n":25,"t":"성채 포획전","sub":"철벽녀의 허점","gm":"정면 방어 100%.","hero":["xingcai"],"kind":"capture","lines":[{"w":"xingcai","t":"초선, 당신의 그 천박한 노출은 제 단단한 방패를 뚫을 수 없습니다!"},{"w":"choseon","t":"답답하게 껴입긴. 그 쇳덩어리들, 내가 땀 뻘뻘 흘리게 해서 다 벗겨줄게."},{"w":"xingcai","t":"크윽... 당신의 노골적인 움직임에 방패를 놓쳤습니다... 차가운 쇠가 아니라 이런 부드러운 감촉이... 마음대로 능욕하십시오.","note":"갑옷이 부서지며"}]},{"n":26,"t":"마초 구출전","sub":"텐션 조절 실패","gm":"스피커 소음 공격.","hero":["machao"],"kind":"rescue","lines":[{"w":"machao","t":"정의의 맹렬하고 빠른 찌르기를 보여주겠다! 초선! 나와 함께 밤새도록 달리자!"},{"w":"choseon","t":"소리만 빽빽 지르고 실속은 하나도 없는 타입. 넌 보나 마나 3초면 끝날 게 뻔해. 침대에서도 시끄러울 것 같아서 탈락이야."}]},{"n":27,"t":"관우 구출전","sub":"묶인 수염","gm":"타이머 타임어택.","hero":["guanyu"],"kind":"rescue","lines":[{"w":"guanyu","t":"이놈들이 내 자랑스러운 수염을 의자에 묶어버렸소. 이 수치심에 차라리 혀를 깨물고 싶소이다..."},{"w":"choseon","t":"어머, 그 긴 수염을 목줄처럼 쥐고 흔들기 딱 좋게 생겼네? 앞으로 네 목줄은 내가 쥔다, 관우야."}]},{"n":28,"t":"월영 포획전","sub":"공순이의 연산 초과","gm":"호전차 해킹.","hero":["yueying"],"kind":"capture","lines":[{"w":"yueying","t":"분석 완료. 초선, 노출도 90% 이상의 의상은 방어력이 제로에 가깝군요."},{"w":"choseon","t":"기름 냄새나는 공방에만 처박혀 있으니 남자가 딴생각을 하지! 남자들이 알아서 벗겨주려고 안달인데 방어력이 왜 필요해?"},{"w":"yueying","t":"경고... 당신의 페로몬 수치가 제 연산 한계치를 돌파했습니다... 하아... 머릿속이 퓨즈가 나간 것처럼 하얘져요..."}]},{"n":29,"t":"제갈량 & 방통 구출전","sub":"샌드위치 신세","gm":"돌풍과 함정.","hero":["zhugeliang","pangtong"],"kind":"rescue","lines":[{"w":"zhugeliang","t":"하아... 저는 당신이 저를 구하러 올 때까지 이 끈적한 지하에서 얌전히 기다리고 있었습니다."},{"w":"pangtong","t":"초선 공, 내 못생긴 얼굴 대신 내 거대한 지략... 아니 다른 걸 보여주겠소!"},{"w":"choseon","t":"책상물림 아저씨들이 입만 살아서는. 둘 다 내 대기표 100번대니까 얌전히 바닥에 엎드려서 체력장이나 하고 있어."}]},{"n":30,"t":"유비 구출","sub":"가짜 덕(德)","gm":"백성 고기방패.","hero":["liubei"],"kind":"rescue","lines":[{"w":"liubei","t":"오오, 초선! 덕으로 당신을 품고 싶었소! 내 커다란 귀처럼, 당신의 모든 신음 소리를 다 들어주리다!"},{"w":"choseon","t":"귀만 크면 뭐해, 정작 중요한 '그곳'의 지갑은 텅텅 비었으면서. 넌 오늘부터 내 발마사지 전담 노예야."}]},{"n":31,"t":"화웅 구출전","sub":"조루의 비애","gm":"1분 타임어택.","hero":["huaxiong"],"kind":"rescue","lines":[{"w":"huaxiong","t":"술이 식기 전에... 아니, 당신의 뜨거운 열기가 식기 전에 내가 모든 걸 끝내주겠소! 우오오!"},{"w":"choseon","t":"입만 열면 허풍. 넌 시작하자마자 3초면 끝나서 술 데울 시간도 안 나오잖아? 구석에 찌그러져 있어."}]},{"n":32,"t":"원술 구출전","sub":"달콤한 꿀물","gm":"꿀물 리어카 호위.","hero":["yuanshu"],"kind":"rescue","lines":[{"w":"yuanshu","t":"꿀물... 꿀물을 다오... 초선아, 네 쇄골에 흐르는 그 땀방울이라도 핥게 해다오..."},{"w":"choseon","t":"더러운 아저씨가 어딜 감히. 꿀물 대신 내 가죽구두 굽에 묻은 흙이나 핥아먹어."}]},{"n":33,"t":"원소 구출전","sub":"명문가의 타락","gm":"짝퉁 원소 찾기.","hero":["yuanshao"],"kind":"rescue","lines":[{"w":"yuanshao"," /* 벚꽃잎과 반짝임 (시작 화면이 보일 때만 그린다) */
function startPetals(){
  const c=$('tpet'),g=c.getContext('2d'),W=1672,H=941,P=[];
  const mk=(init)=>({x:Math.random()*W*1.1,y:init?Math.random()*H:-30,s:5+Math.random()*9,vy:30+Math.random()*50,vx:-20+Math.random()*30,ph:Math.random()*6.3,sp:1+Math.random()*2.2,rot:Math.random()*6.3,vr:-1.5+Math.random()*3,a:.55+Math.random()*.4,hue:Math.random()<.2?'255,220,230':'255,120,175'});
  for(let i=0;i<46;i++)P.push(mk(true));
  const S=[];for(let i=0;i<34;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,ph:Math.random()*6.3,sp:.8+Math.random()*1.8});
  let last=performance.now();
  function f(t){
    requestAnimationFrame(f);
    if($('s_title').hidden)return;
    const dt=Math.min(.05,(t-last)/1000);last=t;
    g.clearRect(0,0,W,H);
    g.globalCompositeOperation='lighter';
    for(const s of S){const a=.5+.5*Math.sin(t/1000*s.sp+s.ph);g.fillStyle='rgba(255,226,150,'+(.55*a)+')';g.beginPath();g.arc(s.x,s.y,s.r*(.6+.5*a),0,7);g.fill();}
    g.globalCompositeOperation='source-over';
    for(const p of P){
      p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t/1000*p.sp+p.ph)*28)*dt;p.rot+=p.vr*dt;
      if(p.y>H+30||p.x<-40){Object.assign(p,mk(false));p.x=Math.random()*W*1.1;}
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,.55+.45*Math.abs(Math.sin(p.rot*1.3)));
      g.fillStyle='rgba('+p.hue+','+p.a+')';g.beginPath();g.ellipse(0,0,p.s,p.s*.55,0,0,7);g.fill();
      g.restore();
    }
  }
  requestAnimationFrame(f);
}

      else if(kind==='save')flag('CHOSEON_SYNC_DIRTY',true);
    }catch(e){
      note('기기 저장 확인 실패: '+e.message);
      // Existing local saves must NEVER be treated as missing when their
      // illustration/JSON snapshot fails: this would wrongly auto-apply Drive.
      if(kind==='ready'&&!localStorage.getItem(KEY))bridge.webReady('');
      else if(kind==='ready')overlay('기기 저장 확인에 실패했습니다. 기존 진행을 보호하고 있습니다.');
    }
  }
  function requestSync(gate){
    if(!app||window.CHOSEON_SYNC_CONFLICT||window.CHOSEON_BACKUP_RESTORING)return;
    if(!bridge.hasBackupFile())return;
    if(gate)onSyncStart();
    sendLocal('sync');
  }
  function onGameSaved(){
    if(!app||!bridge.hasBackupFile())return;
    if(window.CHOSEON_SYNC_CHECKING||window.CHOSEON_SYNC_CONFLICT||window.CHOSEON_BACKUP_RESTORING){
      flag('CHOSEON_SYNC_DIRTY',true);return;
    }
    clearTimeout(pendingSave);
    pendingSave=setTimeout(()=>sendLocal('save'),1500);
  }
  function flushSave(){
    if(window.CHOSEON_SYNC_CHECKING||window.CHOSEON_SYNC_CONFLICT||window.CHOSEON_BACKUP_RESTORING)return;
    try{if(typeof save==='function')save();}catch(e){}
    if(app){clearTimeout(pendingSave);sendLocal('save');}
  }
  async function backup(){
    if(app){bridge.pickBackup();return;}
    if(bridge){note('동기화 지원 APK가 필요합니다. 기존 앱을 삭제하지 말고 새 APK를 설치하세요.');return;}
    try{
      const data=await snapshot();if(!data)throw Error('아직 저장된 게임이 없습니다');
      const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='Choseon-Musou-Save.json';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),12000);
      note('저장 파일을 내려받았습니다.');
    }catch(e){note('내보내기 실패: '+e.message);}
  }
  function restore(){
    if(app){requestSync(true);return;}
    if(bridge){note('동기화 지원 APK를 설치해 주세요.');return;}
    const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
    input.onchange=()=>{
      if(!input.files||!input.files.length)return;
      input.files[0].text().then(text=>{
        const data=validDoc(text);
        if(!window.confirm('선택한 파일로 현재 진행을 교체하시겠습니까?'))return;
        onApplied(JSON.stringify(data));
      }).catch(e=>note('저장 파일 오류: '+e.message));
    };
    input.click();
  }
  window.ChoseonCloud={backup,restore,requestSync,flushSave,onGameSaved,onSyncStart,onSyncDone,
    onConflict,onApplied,onNativeStatus,validDoc,
    get mode(){return app?'Android SAF · baseT 동기화':'웹 파일 가져오기/내보내기';}};
  addEventListener('online',()=>{if(app)requestSync(true);});
  // ARPG: initial read (not blind write). A linked-file gate is active at boot.
  Promise.resolve().then(()=>sendLocal('ready'));
})();

</script>
