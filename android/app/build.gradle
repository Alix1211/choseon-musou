plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kane.choseonmusou'
    compileSdk 35

    // Test/prototype signature, reused from this owner's ARPG project to avoid
    // changing the certificate on every GitHub Actions runner.
    // Do NOT use this publicly stored test key for a production release.
    signingConfigs {
        stableTest {
            storeFile rootProject.file('choseon-test.keystore')
            storePassword 'arpg1234'
            keyAlias 'arpg'
            keyPassword 'arpg1234'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
    }

    defaultConfig {
        applicationId 'com.kane.choseonmusou'
        minSdk 24
        targetSdk 32
        // Seconds since 2025-01-01 UTC. Increases across fresh GitHub runners.
        versionCode ((int) (System.currentTimeMillis() / 1000L - 1735689600L))
        versionName '0.10-zhenji-swap'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncGameAssets', Copy) {
    from(rootProject.file('../index.html'))
    from(rootProject.file('../a')) { into 'a' }
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn('syncGameAssets') }
