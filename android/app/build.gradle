plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kane.choseonmusou'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kane.choseonmusou'
        minSdk 24
        targetSdk 32
        versionCode 2
        versionName '0.2-combo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncGameAssets', Copy) {
    from(rootProject.file('../index.html'))
    from(rootProject.file('../a')) { into 'a' }
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn('syncGameAssets') }
