name: Android APK (Choseon Musou)

on:
  push:
    branches: [gpt-gimmicks]
    paths:
      - 'android/**'
      - 'index.html'
      - '_new/**'
      - 'a/**'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Regenerate game from canonical sources (review before commit)
        run: |
          mkdir -p /tmp/choseon-range-review
          cp index.html /tmp/choseon-range-review/index_before.html
          python3 _new/p2.py
          cp index.html /tmp/choseon-range-review/index_regenerated.html
          git diff --numstat -- index.html | tee /tmp/choseon-range-review/diffstat.txt
          git diff -- index.html > /tmp/choseon-range-review/index.patch
      - name: Upload regenerated index and exact diff for review
        uses: actions/upload-artifact@v4
        with:
          name: choseon-whip-range-regeneration-review
          path: /tmp/choseon-range-review/
          if-no-files-found: error
          retention-days: 3
      - name: Test real whip hit functions vs visual range
        run: node tools/test_whip_reach.cjs
      - name: Validate lightweight Canvas effects
        run: node tools/check_fx_budget.cjs
      - name: Check safe live updates and Drive backup wiring
        run: node tools/check_live_cloud.cjs
      - name: Check ARPG Drive save sync protocol
        run: node tools/check_drive_sync.cjs
      - name: Test ARPG baseT decide port (16 exact decision cases)
        run: |
          mkdir -p /tmp/choseon-decide-tests
          javac -d /tmp/choseon-decide-tests android/app/src/main/java/com/kane/choseonmusou/SaveSyncDecider.java tools/SaveSyncDeciderTest.java
          java -cp /tmp/choseon-decide-tests com.kane.choseonmusou.SaveSyncDeciderTest
      - name: Prevent ranged-whip effects from returning
        run: node tools/check_whip_melee.cjs
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify test signature and package version
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.kane.choseonmusou' versionCode='"
      - name: Store stable-signing APK
        uses: actions/upload-artifact@v4
        with:
          name: choseon-musou-stable-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Bundle stable signing utility for the verified voice APK
        run: |
          mkdir -p "$RUNNER_TEMP/choseon-voice-sign-tools"
          cp android/choseon-test.keystore "$RUNNER_TEMP/choseon-voice-sign-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/choseon-voice-sign-tools/"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/choseon-voice-sign-tools/"
      - name: Commit reviewed generated game to gpt-gimmicks only
        if: github.ref == 'refs/heads/gpt-gimmicks'
        run: |
          git config user.name 'choseon-build'
          git config user.email 'choseon-build@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate 170px whip reach from canonical sources'
            git push origin HEAD:gpt-gimmicks
          fi
      - name: Store local voice APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: choseon-local-signing-tools
          path: ${{ runner.temp }}/choseon-voice-sign-tools/
          if-no-files-found: error
          retention-days: 2
