name: Android APK (Choseon Musou)

on:
  push:
    branches: [gpt-gimmicks]
    paths:
      - 'android/**'
      - 'index.html'
      - 'a/**'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate lightweight Canvas effects
        run: node tools/check_fx_budget.cjs
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify test signature and package version
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "package: name='com.kane.choseonmusou' versionCode='"
      - name: Store stable-signing APK
        uses: actions/upload-artifact@v4
        with:
          name: choseon-musou-stable-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
